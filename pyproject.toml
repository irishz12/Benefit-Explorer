[tool.pytest.ini_options]
testpaths = ["backend/tests", "evaluation/tests"]
pythonpath = ["backend", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Both entry points extend sys.path so that `backend` and the repository root
# are importable, which has to happen before the imports that depend on it.
"evaluation/run_evaluation.py" = ["E402"]
"evaluation/src/runner.py" = ["E402"]
